<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas</title>
    <meta name="description" content="Tabla de Facturas">
    <link rel="icon" type="image/png" href="/static/assets/img/logo_trebol.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!--Insertar Tailwind-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <style>
        /* Estilos del cuerpo de la tabla de facturas */
        #listado-facturas tr {
            background-color: #ffffff;
            color: #111827;
        }

        #listado-facturas tr:hover {
            background-color: rgba(0, 255, 128, 0.08);
            transition: background-color 0.2s ease;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col" style="background-color: #f3f4f6;">
    <!-- Insertamos el menú compartido -->
    {% include 'menu.html' %}

    <!-- Tailwind: flex-grow y padding -->
    <main class="flex-grow p-4 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="titulo-seccion">Listado de Facturas</h1>
        </div>

        <!-- DaisyUI: table y Tailwind: rounded-box shadow -->
        <div class="overflow-x-auto rounded-box shadow glow-verde">
            <table class="table w-full" style="background-color: #fff;">
                <!-- head -->
                <thead style="background-color: var(--color-oscuro); color: var(--color-acento);">
                    <tr>
                        <th>ID Factura</th>
                        <th>Nº Factura</th>
                        <th>Fecha Emisión</th>
                        <th>Fecha Vencimiento</th>
                        <th>ID Pedido</th>
                        <th>ID Cliente</th>
                        <th>Base Imponible</th>
                        <th>IVA (%)</th>
                        <th>Total Factura</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="listado-facturas">
                    <!-- Plantilla oculta para clonar -->
                    <tr id="factura-plantilla" style="display: none;">
                        <th class="id-factura font-bold text-gray-700"></th>
                        <td class="num-factura"></td>
                        <td class="fecha-emision"></td>
                        <td class="fecha-vencimiento"></td>
                        <td class="id-pedido-factura"></td>
                        <td class="id-cliente-factura"></td>
                        <td class="base-imponible-factura font-semibold text-gray-600"></td>
                        <td class="tipo-iva-factura text-gray-500"></td>
                        <td class="total-factura font-bold text-emerald-700"></td>
                        <td class="estado-factura"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="background-color: var(--color-oscuro);" class="text-center bg-gray-900 text-gray-400 py-6 mt-10">
        &copy; ADROMITECH 2026
    </footer>

    <!-- Traemos jQuery para las llamadas AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Al cargar la página, pedimos las facturas al backend por AJAX
        $.getJSON("facturas").done(function (json) {
            let listado = document.getElementById("listado-facturas");
            let plantilla = document.getElementById("factura-plantilla");

            // Recorremos el array de facturas que nos devuelve Flask o el backend
            json.forEach((element) => {
                // Clonamos la plantilla HTML
                let clon = plantilla.cloneNode(true);
                clon.id = ""; // Evitamos duplicar el id
                clon.style.display = "table-row"; // Mantiene la estructura correcta de la tabla

                // Rellenamos los datos de la factura en el clon
                clon.querySelector(".id-factura").textContent = element.id_factura || element.id; 
                clon.querySelector(".num-factura").textContent = element.num_factura || '-';
                clon.querySelector(".fecha-emision").textContent = element.fecha_emision || '-';
                clon.querySelector(".fecha-vencimiento").textContent = element.fecha_vencimiento || '-';
                clon.querySelector(".id-pedido-factura").textContent = element.id_pedido || '-';
                clon.querySelector(".id-cliente-factura").textContent = element.id_cliente || '-';
                clon.querySelector(".base-imponible-factura").textContent = element.base_imponible || '-';
                clon.querySelector(".tipo-iva-factura").textContent = element.tipo_iva || '-';
                clon.querySelector(".total-factura").textContent = element.total_factura || '-';
                clon.querySelector(".estado-factura").textContent = element.estado || '-';

                // Añadimos el clon ya relleno al contenedor principal
                listado.appendChild(clon);
            });
        }).fail(function() {
            console.error("Error al obtener las facturas. Asegúrate de que el endpoint devuelve un JSON válido.");
        });
    </script>
</body>

</html>
