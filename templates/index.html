<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM ADROMITECH</title>
    <meta name="description" content="Panel de control del CRM Adromitech. Resumen de leads, clientes y pedidos.">
    <link rel="icon" type="image/png" href="/static/assets/img/logo_trebol.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <style>
        /* ── Ticker del menú ── */
        /* Para que funcione la animación del ticker se debe incluir estos keyframes en todos los html debido a que el ticker se aloja en menu.html */
        @keyframes desplazamiento {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .animacion {
            display: flex;
            width: max-content;
            animation: desplazamiento 16s linear infinite;
        }

        .animacion:hover {
            animation-play-state: paused;
        }

        /* ── Entrada escalonada para las tarjetas de estadísticas ── */
        .card-stat {
            animation: entrada-abajo 0.45s ease both;
        }

        .card-stat:nth-child(1) {
            animation-delay: 0.05s;
        }

        .card-stat:nth-child(2) {
            animation-delay: 0.15s;
        }

        .card-stat:nth-child(3) {
            animation-delay: 0.25s;
        }

        @keyframes entrada-abajo {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hover en los enlaces de las tarjetas */
        .card-stat a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col" style="background-color: #f3f4f6;">
    {% include 'menu.html' %}

    <main class="flex-grow p-4 md:p-8">

        <!-- Cabecera -->
        <div class="mb-8">
            <h1 class="titulo-seccion">Panel de Control</h1>
            <p class="text-gray-500 mt-1 text-sm">Resumen general del CRM en tiempo real</p>
        </div>

        <!-- Tarjetas de estadísticas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

            <!-- Tarjeta Leads (fondo blanco) -->
            <div class="card-stat stat rounded-2xl shadow-md glow-verde"
                style="background-color: #ffffff; border-left: 5px solid var(--color-acento);">
                <div class="stat-figure">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="var(--color-oscuro-suave)" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <div class="stat-title font-bold uppercase text-xs tracking-widest"
                    style="color: var(--color-oscuro); opacity: 0.7;">Total Leads</div>
                <div class="stat-value text-4xl font-extrabold" style="color: var(--color-oscuro);" id="stat-leads">—
                </div>
                <div class="stat-desc font-semibold">
                    <a href="/admin-leads" style="color: var(--color-acento-suave);">Ver listado →</a>
                </div>
            </div>

            <!-- Tarjeta Clientes (fondo oscuro) -->
            <div class="card-stat stat rounded-2xl shadow-md"
                style="background-color: var(--color-oscuro); border-left: 5px solid var(--color-acento);">
                <div class="stat-figure">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="var(--color-acento)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </div>
                <div class="stat-title font-bold uppercase text-xs tracking-widest"
                    style="color: var(--color-acento); opacity: 0.8;">Total Clientes</div>
                <div class="stat-value text-4xl font-extrabold" style="color: var(--color-acento);" id="stat-clientes">—
                </div>
                <div class="stat-desc font-semibold">
                    <a href="/admin-clientes" style="color: var(--color-gris-texto);">Ver listado →</a>
                </div>
            </div>

            <!-- Tarjeta Pedidos (fondo blanco) -->
            <div class="card-stat stat rounded-2xl shadow-md"
                style="background-color: #ffffff; border-left: 5px solid var(--color-oscuro);">
                <div class="stat-figure">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="var(--color-oscuro)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                </div>
                <div class="stat-title font-bold uppercase text-xs tracking-widest"
                    style="color: var(--color-oscuro); opacity: 0.7;">Total Pedidos</div>
                <div class="stat-value text-4xl font-extrabold" style="color: var(--color-oscuro);" id="stat-pedidos">—
                </div>
                <div class="stat-desc font-semibold">
                    <a href="/admin-pedidos" style="color: var(--color-oscuro-suave);">Ver listado →</a>
                </div>
            </div>

        </div>

    <!-- Carrusel -->
    <section class="mt-8 mb-8 w-full">
        <div class="mb-6">
            <h2 class="titulo-seccion w-fit">Nuestros productos</h2>
        </div>
        <div class="relative h-94 overflow-hidden rounded-xl max-w-2xl mx-auto mt-10 shadow-md">
            <img id="imagen1" class="absolute w-full h-full object-contain opacity-100 transition-opacity duration-700"
                src="/static/assets/img/imagen.png">
            <img id="imagen2" class="absolute w-full h-full object-contain opacity-0 transition-opacity duration-700"
                src="/static/assets/img/imagen1.png">
            <img id="imagen3" class="absolute w-full h-full object-contain opacity-0 transition-opacity duration-700"
                src="/static/assets/img/Imagen2.png">
            <img id="imagen4" class="absolute w-full h-full object-contain opacity-0 transition-opacity duration-700"
                src="/static/assets/img/Imagen3.png">
            <img id="imagen5" class="absolute w-full h-full object-contain opacity-0 transition-opacity duration-700"
                src="/static/assets/img/Imagen4.png">
        </div>

        <!-- Botones -->
        <div class="flex justify-center gap-6 mt-4">
            <button onclick="anterior()" style="background-color: var(--color-acento); color: var(--color-oscuro);"
                class="rounded-full p-3 transition-opacity shadow-md hover:opacity-80">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
                    <path fill-rule="evenodd"
                        d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z"
                        clip-rule="evenodd" />
                </svg>
            </button>
            <button onclick="siguiente()" style="background-color: var(--color-acento); color: var(--color-oscuro);"
                class="rounded-full p-3 transition-opacity shadow-md hover:opacity-80">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
                    <path fill-rule="evenodd"
                        d="M16.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L14.69 12 7.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </section>

    </main>

    <!-- FOOTER -->
    <footer style="background-color: var(--color-oscuro);" class="text-center text-gray-400 py-6 mt-10 text-sm">
        &copy; ADROMITECH 2026
    </footer>

    <script>
        // Se pide al servidor la ruta /dashboard/stats para obtener las estadísticas actualizadas y mostrarlas en las tarjetas
        fetch("/dashboard/stats")
            .then(res => res.json()) //se guarda la respuesta del servidor en formato JSON
            .then(data => {
                //Aqui, se actualizan los valores de las tarjetas con los datos obtenidos del servidor. 
                //Si algún dato no está disponible, se muestra un guion "—" como valor predeterminado.
                document.getElementById("stat-leads").textContent = data.leads ?? "—";
                document.getElementById("stat-clientes").textContent = data.clientes ?? "—";
                document.getElementById("stat-pedidos").textContent = data.pedidos ?? "—";
            })
            .catch(() => {
                //Si el servidor no responde o hay un error en la solicitud, se muestra un guion "—" en todas las tarjetas para indicar que no se pudieron cargar los datos.
                ["stat-leads", "stat-clientes", "stat-pedidos"].forEach(id => {
                    document.getElementById(id).textContent = "—";
                });
            });

        // Logica para el carrusel, haciendo como en clase, el ejemplo fade
        let imagenActual = 1;

        function siguiente() {
            imagenActual++;
            if (imagenActual > 5) imagenActual = 1;
            mostrar(imagenActual);
        }

        function anterior() {
            imagenActual--;
            if (imagenActual < 1) imagenActual = 5;
            mostrar(imagenActual);
        }

        function mostrar(numero) {
            const imagenes = [
                document.getElementById("imagen1"),
                document.getElementById("imagen2"),
                document.getElementById("imagen3"),
                document.getElementById("imagen4"),
                document.getElementById("imagen5")
            ];
            //ocultar todas las imagenes, menos la indicada
            imagenes.forEach((imagen, i) => {
                let imagen_mostrar = numero - 1;
                if (imagen_mostrar == i) {
                    imagen.classList.remove("opacity-0");
                    imagen.classList.add("opacity-100");
                } else {
                    imagen.classList.remove("opacity-100");
                    imagen.classList.add("opacity-0");
                }
            });
        }
    </script>

</body>

</html>
