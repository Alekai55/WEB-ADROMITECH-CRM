<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM ADROMITECH</title>
    <link rel="icon" type="image/png" href="/static/assets/img/logo_trebol.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <style>
        /* Animación CSS para el Ticker superior */
        @keyframes desplazamiento {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .animacion {
            display: flex;
            width: max-content;
            animation: desplazamiento 16s linear infinite;
        }

        .animacion:hover {
            animation-play-state: paused;
            /* Se para al pasar el ratón */
        }

        /* Estilos del cuerpo de la tabla de leads */
        #listado-leads tr {
            background-color: #ffffff;
            color: #111827;
        }

        #listado-leads tr:hover {
            background-color: rgba(0, 255, 128, 0.08);
            transition: background-color 0.2s ease;
        }
    </style>
</head>

<!-- He añadido flex y flex-col para que el footer se quede abajo si hay poco contenido -->

<body class="min-h-screen flex flex-col" style="background-color: #f3f4f6;">
    <!-- Insertamos el menú compartido -->
    {% include 'menu.html' %}

    <main class="flex-grow p-4 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="titulo-seccion">Listado de Leads</h1>
            <button class="btn"
                style="background-color: var(--color-oscuro); color: var(--color-acento); border: none;">Nuevo
                Contacto</button>
        </div>

        <div class="overflow-x-auto rounded-box shadow glow-verde">
            <table class="table w-full" style="background-color: #fff;">
                <!-- head -->
                <thead style="background-color: var(--color-oscuro); color: var(--color-acento);">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Empresa</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Captación</th>
                        <th>Estado</th>
                        <th>Fecha de Contacto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listado-leads">
                    <!-- Plantilla oculta para clonar -->
                    <tr id="leads-plantilla" style="display: none;">
                        <th class="id-lead"></th>
                        <td class="nombre-lead"></td>
                        <td class="empresa-lead"></td>
                        <td class="telefono-lead"></td>
                        <td class="email-lead"></td>
                        <td class="captacion-lead"></td>
                        <td>
                            <div class="estado-cliente estado-lead badge text-white badge-sm font-bold"></div>
                        </td>
                        <td class="fecha-de-contacto-lead"></td>
                        <td class="flex gap-2">
                            <button class="btn btn-xs btn-info text-white">Editar</button>
                            <button class="btn btn-xs btn-error text-white">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="background-color: var(--color-oscuro);" class="text-center bg-gray-900 text-gray-400 py-6 mt-10">
        &copy; ADROMITECH 2026
    </footer>

    <!-- Traemos jQuery para las llamadas AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Al cargar la página, pedimos los clientes al backend por AJAX
        $.getJSON("leads").done(function (json) {
            let listado = document.getElementById("listado-leads");
            let plantilla = document.getElementById("leads-plantilla");

            // Recorremos el array de clientes que nos devuelve Flask
            json.forEach((element) => {
                // Clonamos la plantilla HTML
                let clon = plantilla.cloneNode(true);
                clon.id = ""; // Evitamos duplicar el id
                clon.style.display = "table-row"; // Mantiene la estructura correcta de la tabla

                // Rellenamos los datos del cliente en el clon
                clon.querySelector(".id-lead").textContent = element.id_lead;
                clon.querySelector(".nombre-lead").textContent = element.nombre;
                clon.querySelector(".empresa-lead").textContent = element.empresa;
                clon.querySelector(".telefono-lead").textContent = element.telefono;
                clon.querySelector(".email-lead").textContent = element.email;
                clon.querySelector(".captacion-lead").textContent = element.fuente_captacion;
                clon.querySelector(".estado-lead").textContent = element.estado;
                clon.querySelector(".fecha-de-contacto-lead").textContent = element.fecha_contacto;

                // Pintamos el estado según sea activo o inactivo
                let estadoSpan = clon.querySelector(".estado-cliente");
                estadoSpan.textContent = element.estado.toUpperCase();
                if (element.estado === 'activo') {
                    estadoSpan.classList.add("bg-green-100", "text-green-800");
                } else {
                    estadoSpan.classList.add("bg-red-100", "text-red-800");
                }

                // Añadimos el clon ya relleno al contenedor principal
                listado.appendChild(clon);
            });
        });
    </script>

</body>

</html>
