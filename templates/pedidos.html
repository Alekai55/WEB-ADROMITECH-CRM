<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <meta name="description" content="Tabla de Pedidos">
    <link rel="icon" type="image/png" href="/static/assets/img/logo_trebol.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!--Insertar Tailwind-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/static/assets/css/style.css">
    <style>
        /* Animación CSS para el Ticker superior */
        @keyframes desplazamiento {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .animacion {
            display: flex;
            width: max-content;
            animation: desplazamiento 16s linear infinite;
        }

        .animacion:hover {
            animation-play-state: paused;
            /* Se para al pasar el ratón */
        }

        /* Estilos del cuerpo de la tabla de pedidos */
        #listado-pedidos tr {
            background-color: #ffffff;
            color: #111827;
        }

        #listado-pedidos tr:hover {
            background-color: rgba(0, 255, 128, 0.08);
            transition: background-color 0.2s ease;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col" style="background-color: #f3f4f6;">
    <!-- Insertamos el menú compartido -->
    {% include 'menu.html' %}

    <main class="flex-grow p-4 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="titulo-seccion">Listado de Pedidos</h1>
        </div>

        <div class="overflow-x-auto rounded-box shadow glow-verde">
            <table class="table w-full" style="background-color: #fff;">
                <!-- head -->
                <thead style="background-color: var(--color-oscuro); color: var(--color-acento);">
                    <tr>
                        <th>ID Pedido</th>
                        <th>Fecha Pedido</th>
                        <th>Estado</th>
                        <th>ID Cliente</th>
                        <th>ID Comercial</th>
                    </tr>
                </thead>
                <tbody id="listado-pedidos">
                    <!-- Plantilla oculta para clonar -->
                    <tr id="pedido-plantilla" style="display: none;">
                        <th class="id-pedido font-bold text-gray-700"></th>
                        <td class="fecha-pedido"></td>
                        <td class="estado-pedido"></td>
                        <td class="id-cliente-pedido"></td>
                        <td class="id-comercial-pedido"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="background-color: var(--color-oscuro);" class="text-center bg-gray-900 text-gray-400 py-6 mt-10">
        &copy; ADROMITECH 2026
    </footer>

    <!-- Traemos jQuery para las llamadas AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Al cargar la página, pedimos los pedidos al backend por AJAX
        $.getJSON("pedidos").done(function (json) {
            let listado = document.getElementById("listado-pedidos");
            let plantilla = document.getElementById("pedido-plantilla");

            // Recorremos el array de pedidos que nos devuelve Flask o el backend
            json.forEach((element) => {
                // Clonamos la plantilla HTML
                let clon = plantilla.cloneNode(true);
                clon.id = ""; // Evitamos duplicar el id
                clon.style.display = "table-row"; // Mantiene la estructura correcta de la tabla

                // Rellenamos los datos del pedido en el clon
                clon.querySelector(".id-pedido").textContent = element.id_pedido || element.id;
                clon.querySelector(".fecha-pedido").textContent = element.fecha_pedido || '-';
                clon.querySelector(".estado-pedido").textContent = element.estado || 'pendiente';
                clon.querySelector(".id-cliente-pedido").textContent = element.id_cliente || '-';
                clon.querySelector(".id-comercial-pedido").textContent = element.id_comercial || '-';

                // Añadimos el clon ya relleno al contenedor principal
                listado.appendChild(clon);
            });
        }).fail(function() {
            console.error("Error al obtener los pedidos. Asegúrate de que el endpoint devuelve un JSON válido.");
        });
    </script>
</body>

</html>
