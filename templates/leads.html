<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM ADROMITECH</title>
    <link rel="icon" type="image/png" href="/static/assets/img/logo_trebol.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!--Insertar Tailwind-->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!--Insertar DaisyUI-->
    <link rel="stylesheet" href="/static/assets/css/style.css"> <!--Llamar al archivo css  -->
    <style>
        /* Estilos del cuerpo de la tabla de leads */
        #listado-leads tr {
            background-color: #ffffff;
            color: #111827;
        }

        #listado-leads tr:hover {
            background-color: rgba(0, 255, 128, 0.08);
            transition: background-color 0.2s ease;
        }
    </style>
</head>

<!-- He añadido flex y flex-col para que el footer se quede abajo si hay poco contenido -->

<body class="min-h-screen flex flex-col" style="background-color: #f3f4f6;">
    <!-- Insertamos el menú compartido -->
    {% include 'menu.html' %}

    <main class="flex-grow p-4 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="titulo-seccion">Listado de Leads</h1>
            <!-- Botón DaisyUI: btn -->
            <button id="btn-nuevo-lead" class="btn"
                style="background-color: var(--color-oscuro); color: var(--color-acento); border: none;">Nuevo
                Contacto</button>
        </div>

        <!-- DaisyUI: table y Tailwind: rounded-box shadow -->
        <!-- Gracias a overflow-x-auto la tabla se adaptará al ancho de la pantalla y así no desborda en móvil -->
        <div class="overflow-x-auto rounded-box shadow glow-verde">
            <table class="table w-full" style="background-color: #fff;">
                <!-- head -->
                <thead style="background-color: var(--color-oscuro); color: var(--color-acento);">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Empresa</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Captación</th>
                        <th>Estado</th>
                        <th>Fecha de Contacto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listado-leads">
                    <!-- Plantilla oculta para clonar -->
                    <tr id="leads-plantilla" style="display: none;">
                        <th class="id-lead"></th>
                        <td class="nombre-lead"></td>
                        <td class="empresa-lead"></td>
                        <td class="telefono-lead"></td>
                        <td class="email-lead"></td>
                        <td class="captacion-lead"></td>
                        <td>
                            <div class="estado-cliente estado-lead badge text-white badge-sm font-bold"></div>
                        </td>
                        <td class="fecha-de-contacto-lead"></td>
                        <td class="flex gap-2 items-center">

                            <!-- Icono papelera: elimina el lead con confirmación (Botón DaisyUI) -->
                            <button class="btn-eliminar btn btn-xs" title="Eliminar lead"
                                style="background-color: #dc2626; color: #fff; border: none; padding: 4px 8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6" />
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                                    <path d="M10 11v6M14 11v6" />
                                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                                </svg>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="background-color: var(--color-oscuro);" class="text-center bg-gray-900 text-gray-400 py-6 mt-10">
        &copy; ADROMITECH 2026
    </footer>

    <!-- Formulario nuevo lead (DaisyUI: modal) -->
    <!-- dialog es un elemento de html5 que incorpora que se abra y se cierre el modal y que se pueda salir 
     pulsando fuera del modal o con un boton de cerrar (el x del modal). DaisyUI lo oculta por defecto y le pone un fondo oscurecido para que destaque.-->
    <dialog id="modal-nuevo-lead" class="modal modal-bottom sm:modal-middle">
        <!-- Tailwind:w-full: ocupa todo en pantalla pequeña, max-w-3xl: tarjeta grande | glow-verde: neón -->
        <div class="modal-box w-full max-w-3xl glow-verde"
            style="background-color: #fff; padding: 0; overflow-y: auto; max-height: 92vh;">

            <!-- ── Cabecera ── -->
            <div class="px-8 py-5" style="background-color: var(--color-oscuro); border-radius: 1rem 1rem 0 0;">
                <h3 class="titulo-seccion" style="font-size: 1.4rem;color: var(--color-acento);">
                    Nuevo Lead
                </h3>
                <p style="color: var(--color-gris-texto); font-size: 0.85rem; margin-top: 2px;">
                    Rellena los datos del contacto para añadirlo al CRM
                </p>
            </div>

            <!-- ── Cuerpo del formulario ── -->
            <form id="form-nuevo-lead" class="px-8 py-6" style="display: grid; gap: 1.25rem;">

                <!-- Fila 1: Nombre + Empresa -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- apartado del nombre con placeholder orientativo para incluir nombre y apellido | DaisyUI: form-control -->
                    <div class="form-control">
                        <!-- DaisyUI: label le da formato a la etiqueta-->
                        <label class="label pb-1">
                            <span class="label-text font-bold"
                                style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Nombre
                                *</span>
                        </label>
                        <!-- DaisyUI: input le da formato al input-->
                        <input id="f-nombre" type="text" placeholder="Nombre completo"
                            class="input input-bordered w-full" required
                            style="border-color: var(--color-oscuro-suave);">
                    </div>
                    <!-- apartado de la empresa para poner su nombre | DaisyUI: form-control -->
                    <div class="form-control">
                        <label class="label pb-1">
                            <span class="label-text font-bold"
                                style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Empresa</span>
                        </label>
                        <input id="f-empresa" type="text" placeholder="Nombre de la empresa"
                            class="input input-bordered w-full" style="border-color: var(--color-oscuro-suave);">
                    </div>
                </div>

                <!-- Fila 2: Teléfono + Email -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- apartado del teléfono con placeholder de referencia | DaisyUI: form-control -->
                    <div class="form-control">
                        <label class="label pb-1">
                            <span class="label-text font-bold"
                                style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Teléfono</span>
                        </label>
                        <input id="f-telefono" type="tel" maxlength="9" placeholder="600 000 000"
                            class="input input-bordered w-full" style="border-color: var(--color-oscuro-suave);">
                    </div>
                    <!-- apartado del email con placeholder orientativo | DaisyUI: form-control -->
                    <div class="form-control">
                        <label class="label pb-1">
                            <span class="label-text font-bold"
                                style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Email</span>
                        </label>
                        <!-- DaisyUI: input y input-bordered -->
                        <input id="f-email" type="email" placeholder="correo@ejemplo.com"
                            class="input input-bordered w-full" style="border-color: var(--color-oscuro-suave);">
                    </div>
                </div>

                <!-- Fila 3: Captación + Estado -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- captación: opciones seleccionables para evitar confusión | DaisyUI: form-control -->
                    <div class="form-control">
                        <label class="label pb-1">
                            <span class="label-text font-bold"
                                style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Captación</span>
                        </label>
                        <!-- DaisyUI: select  -->
                        <select id="f-captacion" class="select select-bordered w-full"
                            style="border-color: var(--color-oscuro-suave);">
                            <option value="">Seleccionar...</option>
                            <option>Formulario Web</option>
                            <option>Campaña Google</option>
                            <option>Redes Sociales</option>
                            <option>Referido</option>
                            <option>Llamada directa</option>
                            <option>Otro</option>
                        </select>
                    </div>
                    <!-- estado: opciones seleccionables | DaisyUI: form-control -->
                    <div class="form-control">
                        <label class="label pb-1">
                            <span class="label-text font-bold"
                                style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Estado</span>
                        </label>
                        <select id="f-estado" class="select select-bordered w-full"
                            style="border-color: var(--color-oscuro-suave);">
                            <option value="">Seleccionar...</option>
                            <option>nuevo</option>
                            <option>en progreso</option>
                            <option>convertido</option>
                            <option>descartado</option>
                        </select>
                    </div>
                </div>

                <!-- Fila 4: Fecha (columna completa) -->
                <!-- tipo date para evitar confusión con el formato | DaisyUI: form-control -->
                <div class="form-control">
                    <label class="label pb-1">
                        <span class="label-text font-bold"
                            style="color: var(--color-oscuro); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em;">Fecha
                            de contacto</span>
                    </label>
                    <input id="f-fecha" type="date" class="input input-bordered w-full"
                        style="border-color: var(--color-oscuro-suave);">
                </div>

                <!-- Mensaje de error/éxito -->
                <div id="form-mensaje" class="hidden text-sm font-semibold rounded-lg px-4 py-2"></div>

                <!-- Acciones (Botones DaisyUI) -->
                <div class="modal-action mt-0 pt-4" style="border-top: 1px solid #e5e7eb;">
                    <!-- bg-pulso-marca: fondo oscuro pulsante animado -->
                    <button type="submit" id="btn-guardar" class="btn px-8 bg-pulso-marca"
                        style="color: var(--color-acento); border: none; font-weight: 700;">
                        Guardar Lead
                    </button>
                    <button type="button" id="btn-cerrar-modal" class="btn btn-ghost px-8">Cancelar</button>
                </div>

            </form>
        </div>
    </dialog>

    <!-- Estilos de foco para los inputs del modal -->
    <style>
        #form-nuevo-lead input:focus,
        #form-nuevo-lead select:focus {
            outline: 2px solid var(--color-acento);
            border-color: var(--color-acento);
        }

        /* En móvil: colapsar a 1 columna */
        @media (max-width: 640px) {

            #form-nuevo-lead>div[style*="grid-template-columns: 1fr 1fr"] {
                grid-template-columns: 1fr !important;
            }
        }
    </style>


    <!-- Traemos jQuery para las llamadas AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        // Al cargar la página, pedimos los clientes al backend por AJAX
        $.getJSON("leads").done(function (json) {
            let listado = document.getElementById("listado-leads");
            let plantilla = document.getElementById("leads-plantilla");

            // Recorremos el array de clientes que nos devuelve Flask
            json.forEach((element) => {
                // Clonamos la plantilla HTML
                let clon = plantilla.cloneNode(true);
                clon.id = ""; // Evitamos duplicar el id
                clon.style.display = "table-row"; // Mantiene la estructura correcta de la tabla
                clon.dataset.idLead = element.id_lead; // Necesario para los botones de editar y eliminar

                // Rellenamos los datos del cliente en el clon
                clon.querySelector(".id-lead").textContent = element.id_lead;
                clon.querySelector(".nombre-lead").textContent = element.nombre;
                clon.querySelector(".empresa-lead").textContent = element.empresa;
                clon.querySelector(".telefono-lead").textContent = element.telefono;
                clon.querySelector(".email-lead").textContent = element.email;
                clon.querySelector(".captacion-lead").textContent = element.fuente_captacion;
                clon.querySelector(".estado-lead").textContent = element.estado;
                clon.querySelector(".fecha-de-contacto-lead").textContent = element.fecha_contacto;

                // Pintamos el estado según sea activo o inactivo
                let estadoSpan = clon.querySelector(".estado-cliente");
                estadoSpan.textContent = element.estado.toUpperCase();
                if (element.estado === 'activo') {
                    estadoSpan.classList.add("bg-green-100", "text-green-800");
                } else {
                    estadoSpan.classList.add("bg-red-100", "text-red-800");
                }

                // Añadimos el clon ya relleno al contenedor principal
                listado.appendChild(clon);
            });
        }).fail(function () {
            console.error("Error al cargar los leads. Asegúrate de que el endpoint devuelve un JSON válido.");
        });

        // ===== Introducir Lógica del Modal (Formulario de Tailwind) =====
        const modal = document.getElementById("modal-nuevo-lead");
        const btnAbrir = document.getElementById("btn-nuevo-lead");
        const btnCerrar = document.getElementById("btn-cerrar-modal");
        const form = document.getElementById("form-nuevo-lead");
        const mensaje = document.getElementById("form-mensaje");

        // Abrir el modal al hacer clic en el botón
        btnAbrir.addEventListener("click", () => modal.showModal());

        // Cerrar el modal con el botón Cancelar
        btnCerrar.addEventListener("click", () => {
            modal.close();
            form.reset();
            mensaje.classList.add("hidden");
        });

        // Enviar el formulario por AJAX
        form.addEventListener("submit", function (e) {
            e.preventDefault(); // Evitamos que recargue la página al darle a guardar

            //aqui cogemos la informacion del formulario y la guardamos en una variable llamada datos
            const datos = {
                nombre: document.getElementById("f-nombre").value.trim(),
                empresa: document.getElementById("f-empresa").value.trim(),
                telefono: document.getElementById("f-telefono").value.trim(),
                email: document.getElementById("f-email").value.trim(),
                fuente_captacion: document.getElementById("f-captacion").value,
                estado: document.getElementById("f-estado").value,
                fecha_contacto: document.getElementById("f-fecha").value,
            };
            //aqui cogemos la informacion de datos y se la mandamos por http a main.py en la ruta /leads/nuevo
            fetch("/leads/nuevo", {
                method: "POST",
                headers: { "Content-Type": "application/json" }, //  le dice al servidor que le estamos enviando datos en formato JSON y así que use el request.json() 
                body: JSON.stringify(datos) //  convierte el objeto datos en una cadena de texto json plana para que el servidor lo pueda entender
            })
                //el then son promesas, permite ejecutar codigo despues de que la peticion se haya completado  
                .then(res => res.json()) // convierte la respuesta del servidor(flujo de bytes, aunque en main.py nos devuelva un json, asi viaja por el servidor) en un objeto JSON
                .then(json => {
                    if (json.ok) { // si la respuesta es ok
                        // Éxito: cerramos el modal, reseteamos el form y recargamos la tabla
                        modal.close();
                        form.reset();
                        // Limpiamos la tabla y volvemos a cargar los datos desde el servidor
                        document.getElementById("listado-leads").innerHTML =
                            document.getElementById("leads-plantilla").outerHTML;

                        //outerHTML nos permite obtener el molde/estructura (en este caso una etiqueta table) del elemento
                        //para poder recargar la tabla, primero vaciamos el contenedor y luego le insertamos la plantilla
                        //es decir, coge leads-plantilla, mantiene su molde y lo inserta en el contenedor listado-leads, asi no se duplican datos
                        $.getJSON("leads").done(function (json2) {
                            //se envia la peticion a leads y cuando llega, se ejecuta esta funcion con json2 como parametro(los datos de los leads que envia el servidor)
                            let listado = document.getElementById("listado-leads"); //obtenemos el contenedor donde vamos a insertar los datos
                            let plantilla = document.getElementById("leads-plantilla"); //obtenemos el molde de la tabla
                            json2.forEach((element) => {
                                let clon = plantilla.cloneNode(true); //hace una copia del molde(sus tr, td, span...)
                                clon.id = ""; //le quitamos el id al clon porque el id es unico
                                clon.style.display = "table-row"; //ponemos la fila visible porque la plantilla estaba oculta para que no se viese
                                clon.dataset.idLead = element.id_lead; //le asignamos el id del lead al clon porque el id es unico y es el que usa el boton de editar para identificar al lead
                                //ahora pasamos los datos del json al clon
                                clon.querySelector(".id-lead").textContent = element.id_lead;
                                clon.querySelector(".nombre-lead").textContent = element.nombre;
                                clon.querySelector(".empresa-lead").textContent = element.empresa;
                                clon.querySelector(".telefono-lead").textContent = element.telefono;
                                clon.querySelector(".email-lead").textContent = element.email;
                                clon.querySelector(".captacion-lead").textContent = element.fuente_captacion;
                                clon.querySelector(".estado-lead").textContent = element.estado;
                                clon.querySelector(".fecha-de-contacto-lead").textContent = element.fecha_contacto;
                                let estadoSpan = clon.querySelector(".estado-cliente");
                                estadoSpan.textContent = element.estado.toUpperCase();
                                if (element.estado === 'activo' || element.estado === 'convertido') {
                                    estadoSpan.classList.add("bg-green-100", "text-green-800");
                                } else {
                                    estadoSpan.classList.add("bg-red-100", "text-red-800");
                                }
                                listado.appendChild(clon);
                            });
                        });
                    } else {
                        // Error del servidor
                        mensaje.textContent = "❌ " + (json.error || "Error al guardar.");
                        mensaje.style.color = "red";
                        mensaje.classList.remove("hidden");
                    }
                })
                .catch(() => {
                    mensaje.textContent = "❌ No se pudo conectar con el servidor.";
                    mensaje.style.color = "red";
                    mensaje.classList.remove("hidden");
                });
        });

        // ===== Lógica del botón ELIMINAR (papelera) =====
        document.getElementById("listado-leads").addEventListener("click", function (e) {
            const btnEliminar = e.target.closest(".btn-eliminar");
            if (!btnEliminar) return; // Si no han pulsado el botón de la papelera, ignoramos el clic

            const fila = btnEliminar.closest("tr"); // Buscamos la fila (<tr>) más cercana al botón pulsado
            const idLead = fila.dataset.idLead; //cogemos el id del lead que le asignamos antes con dataset.idlead
            const nombre = fila.querySelector(".nombre-lead").textContent; //cogemos el nombre del lead para mostrarlo en el mensaje de confirmacion

            // Confirmación antes de eliminar
            if (!confirm(`¿Seguro que quieres eliminar el lead "${nombre}"?\nEsta acción no se puede deshacer.`)) return;
            // si no se confirma la eliminacion, se ignora el clic

            //luego se envia la peticion a la ruta /leads/eliminar/{idLead} con el metodo delete
            // con ${idLead} le pasamos el id del lead que queremos eliminar

            fetch(`/leads/eliminar/${idLead}`, {
                method: "DELETE"
            })
                .then(res => res.json())
                .then(json => {
                    if (json.ok) {
                        // Eliminamos la fila de la tabla sin recargar la web
                        fila.remove();
                    } else {
                        alert("❌ " + (json.error || "No se pudo eliminar el lead."));
                    }
                })
                .catch(() => alert("❌ No se pudo conectar con el servidor."));
        });
    </script>

</body>

</html>
